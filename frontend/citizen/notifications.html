<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Notifications — Citizen Portal — CyberShield</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/tokens.css">
<link rel="stylesheet" href="../css/base.css">
<link rel="stylesheet" href="../css/components.css">
</head>
<body data-page="notifications">
<div class="app-shell">
  <div id="shell-sidebar"></div>
  <div class="main-col">
    <div id="shell-topbar"></div>
    <div class="content">
      <div class="page-head"><div><h2>Notifications</h2><p>Updates on your cases, evidence, and account activity.</p></div>
        <div class="page-actions"><button class="btn btn-secondary" data-toast-success="All marked as read" onclick="if(window.CS_DATA) CS_DATA.markAllNotificationsAsRead();">Mark all as read</button></div>
      </div>
      <div class="card" id="notifCard"></div>
    </div>
  </div>
</div>
<script src="../js/data.js"></script>
<script src="../js/shell.js"></script>
<script src="../js/app.js"></script>
<script>
  CS_renderShell('citizen','notifications',{pageTitle:'Notifications'});
  const notifCard = document.getElementById('notifCard');
  if (CS_DATA.notifications.length === 0) {
    notifCard.innerHTML = `
      <div style="padding:48px 24px; text-align:center; color:var(--text-secondary);">
        <div style="font-size:48px; margin-bottom:16px;">🔔</div>
        <h4>No new notifications.</h4>
        <p class="text-sm text-secondary" style="margin-top:8px;">You have no new updates or notifications at this time.</p>
      </div>
    `;
  } else {
    notifCard.innerHTML = CS_DATA.notifications.map(n=>`
      <div class="notif-item ${n.unread?'is-unread':''}" data-notif-id="${n.id}" style="padding:18px 20px; cursor:pointer;">
        <span class="notif-dot" style="margin-top:6px; ${n.unread?'':'opacity:0'}"></span>
        <div style="flex:1;"><div style="font-size:14px; font-weight:600;">${n.title}</div><div class="text-sm text-secondary" style="margin-top:2px;">${n.sub}</div><div class="text-xs text-muted" style="margin-top:6px;">${n.time}</div></div>
      </div>`).join('');
  }

  if (window.CS_DATA && CS_DATA.markAllNotificationsAsRead) {
    setTimeout(() => {
      CS_DATA.markAllNotificationsAsRead();
      if (CS_DATA.notifications.length > 0 && notifCard) {
        notifCard.querySelectorAll('.notif-dot').forEach(d => d.style.opacity = '0');
        notifCard.querySelectorAll('.notif-item').forEach(item => item.classList.remove('is-unread'));
      }
    }, 800);
  }
</script>
</body>
</html>
