<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Evidence Review — Cyber Crime Dept. — CyberShield</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../css/tokens.css">
<link rel="stylesheet" href="../../css/base.css">
<link rel="stylesheet" href="../../css/components.css">
</head>
<body data-page="evidence-review">
<div class="app-shell">
  <div id="shell-sidebar"></div>
  <div class="main-col">
    <div id="shell-topbar"></div>
    <div class="content">
      <div class="page-head"><div><h2>Evidence Review</h2><p>Review and authenticate evidence submitted across active cases.</p></div></div>
      <div class="card" id="evCard"></div>
    </div>
  </div>
</div>
<script src="../../js/data.js"></script>
<script src="../../js/shell.js"></script>
<script src="../../js/app.js"></script>
<script>
  CS_renderShell('cybercrime','evidence-review',{pageTitle:'Evidence Review'});
  
  const card = document.getElementById('evCard');
  if (CS_DATA.evidence.length === 0) {
    card.innerHTML = `
      <div style="padding:48px 24px; text-align:center; color:var(--text-secondary);">
        <div style="font-size:48px; margin-bottom:16px;">📄</div>
        <h4>No evidence uploaded.</h4>
        <p class="text-sm text-secondary" style="margin-top:8px;">There is no evidence uploaded for review at this time.</p>
      </div>
    `;
  } else {
    card.innerHTML = CS_DATA.evidence.map(e=>`
      <div class="flex items-center gap-4" style="padding:16px 20px; border-bottom:1px solid var(--border);">
        <div style="width:40px; height:40px; border-radius:8px; background:var(--surface-sunken); display:flex; align-items:center; justify-content:center; font-size:18px;">${e.type==='pdf'?'📄':e.type==='image'?'🖼️':e.type==='audio'?'🎧':'📊'}</div>
        <div style="flex:1;"><strong style="font-size:13.5px;">${e.name}</strong><div class="text-xs text-muted">Case ${e.caseId} · ${e.size} · Uploaded by ${e.by} · ${CS_DATA.fmtDate(e.uploadedOn)}</div></div>
        <span class="chip chip-open">Unreviewed</span>
        <button class="btn btn-sm btn-secondary" data-toast-success="Evidence marked authenticated" onclick="this.disabled=true; this.previousElementSibling.textContent='Authenticated'; this.previousElementSibling.className='chip chip-success';">Authenticate</button>
      </div>`).join('');
  }
</script>
</body>
</html>
