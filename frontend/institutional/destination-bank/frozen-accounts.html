<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Frozen Accounts — Destination Bank — CyberShield</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../css/tokens.css">
<link rel="stylesheet" href="../../css/base.css">
<link rel="stylesheet" href="../../css/components.css">
</head>
<body data-page="frozen-accounts">
<div class="app-shell">
  <div id="shell-sidebar"></div>
  <div class="main-col">
    <div id="shell-topbar"></div>
    <div class="content">
      <div class="page-head"><div><h2>Frozen Accounts</h2><p id="pageSub">Accounts currently on hold pending investigation.</p></div>
        <div class="page-actions"><button class="btn btn-secondary" onclick="CS_toast('Export complete', 'Frozen accounts exported to CSV successfully')">Export CSV</button></div></div>
      <div class="card">
        <div class="table-wrap" style="border:none; border-radius:0;">
          <table class="data-table">
            <thead><tr><th>Account</th><th>Case</th><th>Source Bank</th><th>Amount Held</th><th>Frozen Since</th><th>Reviewed By</th><th>Status</th></tr></thead>
            <tbody id="body"></tbody>
          </table>
        </div>
      </div>
    </div>
  </div>
</div>
<script src="../../js/data.js"></script>
<script src="../../js/shell.js"></script>
<script src="../../js/app.js"></script>
<script>
  CS_renderShell('destBank','frozen-accounts',{pageTitle:'Frozen Accounts'});
  const user = CS_DATA.currentUser.destBank;
  const orgName = user && user.org ? user.org : "Yes Bank";
  const userName = user && user.name ? user.name : "Nodal Officer";
  document.getElementById('pageSub').textContent = `Accounts currently on hold at ${orgName} pending investigation.`;

  const frozen = CS_DATA.freezeRequests.filter(f => (f.bank === orgName || f.destBank === orgName) && f.status === 'Approved');

  const body = document.getElementById('body');
  if (frozen.length === 0) {
    body.innerHTML = `<tr><td colspan="7" class="text-center text-muted" style="padding:24px; font-size:13.5px;">No frozen accounts at ${orgName}.</td></tr>`;
  } else {
    body.innerHTML = frozen.map(f=>`
      <tr>
        <td class="mono text-sm">${f.account}</td>
        <td class="mono text-sm">${f.caseId}</td>
        <td class="text-sm">${f.sourceBank || '—'}</td>
        <td class="mono">${CS_DATA.fmtINR(f.amount)}</td>
        <td class="text-sm text-secondary">${CS_DATA.fmtDate(f.requestedOn).split(' · ')[0]}</td>
        <td class="text-sm">${userName}</td>
        <td><span class="chip chip-frozen">Frozen</span></td>
      </tr>`).join('');
  }
</script>
</body>
</html>
