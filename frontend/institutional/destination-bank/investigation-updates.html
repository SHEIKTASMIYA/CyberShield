<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Investigation Updates — Destination Bank — CyberShield</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../css/tokens.css">
<link rel="stylesheet" href="../../css/base.css">
<link rel="stylesheet" href="../../css/components.css">
</head>
<body data-page="investigation-updates">
<div class="app-shell">
  <div id="shell-sidebar"></div>
  <div class="main-col">
    <div id="shell-topbar"></div>
    <div class="content">
      <div class="page-head"><div><h2>Investigation Updates</h2><p>Cyber Crime Dept. updates on cases involving your frozen accounts.</p></div></div>
      <div class="card card-pad"><div class="timeline" id="tl"></div></div>
    </div>
  </div>
</div>
<script src="../../js/data.js"></script>
<script src="../../js/shell.js"></script>
<script src="../../js/app.js"></script>
<script>
  CS_renderShell('destBank','investigation-updates',{pageTitle:'Investigation Updates'});
  const tl = document.getElementById('tl');
  const user = CS_DATA.currentUser.destBank;
  const orgName = user && user.org ? user.org : "Yes Bank";

  document.querySelector('.page-head p').textContent = `Investigation progress and status updates for cases targeting ${orgName}.`;

  const relevantCases = CS_DATA.cases.filter(c => !orgName || c.destBank === orgName).map(c => c.id);
  const relevantTimeline = (CS_DATA.timeline || []).filter(t => !t.caseId || relevantCases.includes(t.caseId));

  if (relevantTimeline.length === 0) {
    tl.innerHTML = `<div style="padding:40px 24px; text-align:center; color:var(--text-muted); font-size:13.5px;">No investigation updates recorded for ${orgName} yet.</div>`;
  } else {
    tl.innerHTML = relevantTimeline.map(t=>`
      <div class="timeline-item">
        <div class="timeline-dot ${t.done?'done':''}">${t.done?'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M20 6 9 17l-5-5"/></svg>':''}</div>
        <div class="timeline-time">${t.time}</div>
        <div class="timeline-title">${t.title} ${t.caseId ? `<span class="chip chip-progress mono text-xs" style="margin-left:8px;">${t.caseId}</span>` : ''}</div>
        <div class="timeline-desc">${t.desc}</div>
      </div>`).join('');
  }
</script>
</body>
</html>
