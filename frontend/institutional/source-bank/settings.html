<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Source Bank Settings | CyberShield</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../css/tokens.css">
<link rel="stylesheet" href="../../css/base.css">
<link rel="stylesheet" href="../../css/components.css">
</head>
<body data-page="settings">
<a href="#main" class="skip-link">Skip to main content</a>
<div class="app-shell">
  <div id="shell-sidebar"></div>
  <div class="main-col">
    <div id="shell-topbar"></div>
    <main class="content" id="main">
      <div class="page-head">
        <div>
          <h2>Source Bank Operational Settings</h2>
          <p>Configure fraud complaint verification rules, automated freeze triggers, and officer alert preferences.</p>
        </div>
        <div class="page-actions">
          <button class="btn btn-primary" onclick="CS_toast('Settings Saved','Configuration successfully saved.')">Save Settings</button>
        </div>
      </div>

      <div class="flex-col gap-6">
        <div class="card card-pad">
          <div class="setting-header">
            <span class="setting-icon-box">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
            </span>
            <h4>Auto-Verification & Routing</h4>
          </div>
          <div class="grid grid-2">
            <div class="field">
              <label>High-Value Fraud Alert Threshold (INR)</label>
              <input type="number" class="input" value="50000">
              <span class="hint">Complaints above this amount trigger urgent nodal officer SMS alerts.</span>
            </div>
            <div class="field">
              <label>Default Freeze Escalation Window</label>
              <select class="select">
                <option selected>Immediate (Within 15 mins)</option>
                <option>Standard (Within 1 hour)</option>
                <option>Batch Processing</option>
              </select>
            </div>
          </div>
        </div>

        <div class="card card-pad">
          <div class="setting-header">
            <span class="setting-icon-box">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M12 2 3 6v6c0 5 3.8 9.3 9 10 5.2-.7 9-5 9-10V6l-9-4Z"/></svg>
            </span>
            <h4>Security & API Gateways</h4>
          </div>
          <div class="grid grid-2">
            <div class="field">
              <label>Source Bank Gateway Key</label>
              <input type="text" class="input" value="HDFC-GW-KEY-99812-PROD" readonly style="background:var(--surface-sunken);">
            </div>
            <div class="field">
              <label>RBI Nodal Reporting Contact</label>
              <input type="email" class="input" value="rbi-nodal@hdfcbank.com">
            </div>
          </div>
        </div>
      </div>
    </main>
  </div>
</div>
<script src="../../js/data.js"></script>
<script src="../../js/shell.js"></script>
<script src="../../js/app.js"></script>
<script>
  document.addEventListener("DOMContentLoaded", function(){
    CS_renderShell("sourceBank", "settings", {pageTitle: "Settings"});
  });
</script>
</body>
</html>
