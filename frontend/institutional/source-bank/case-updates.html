<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Case Updates — Source Bank — CyberShield</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../css/tokens.css">
<link rel="stylesheet" href="../../css/base.css">
<link rel="stylesheet" href="../../css/components.css">
</head>
<body data-page="case-updates">
<div class="app-shell">
  <div id="shell-sidebar"></div>
  <div class="main-col">
    <div id="shell-topbar"></div>
    <div class="content">
      <div class="page-head"><div><h2>Case Updates</h2><p>Recent activity across cases involving HDFC Bank.</p></div></div>
      <div class="card card-pad"><div class="timeline" id="tl"></div></div>
    </div>
  </div>
</div>
<script src="../../js/data.js"></script>
<script src="../../js/shell.js"></script>
<script src="../../js/app.js"></script>
<script>
  CS_renderShell('sourceBank','case-updates',{pageTitle:'Case Updates'});
  const user = CS_DATA.currentUser.sourceBank;
  const orgName = user && user.org ? user.org : "HDFC Bank";
  document.querySelector('.page-head p').textContent = `Recent activity across cases involving ${orgName}.`;
  
  const tl = document.getElementById('tl');
  const orgLogs = CS_DATA.auditLogs.filter(a => a.actor.includes(orgName) || a.action.includes(orgName));
  
  if (orgLogs.length === 0) {
    tl.innerHTML = `<div style="padding:24px 0; text-align:center; color:var(--text-secondary); font-size:13.5px;">No updates available.</div>`;
  } else {
    tl.innerHTML = orgLogs.map(a=>`
      <div class="timeline-item">
        <div class="timeline-dot done"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M20 6 9 17l-5-5"/></svg></div>
        <div class="timeline-time">${a.time}</div>
        <div class="timeline-title">${a.action}</div>
        <div class="timeline-desc">by ${a.actor}</div>
      </div>`).join('');
  }
</script>
</body>
</html>
