<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Telecom Nodal Officer Profile | CyberShield</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../css/tokens.css">
<link rel="stylesheet" href="../../css/base.css">
<link rel="stylesheet" href="../../css/components.css">
</head>
<body data-page="profile">
<a href="#main" class="skip-link">Skip to main content</a>
<div class="app-shell">
  <div id="shell-sidebar"></div>
  <div class="main-col">
    <div id="shell-topbar"></div>
    <main class="content" id="main">
      <div class="page-head">
        <div>
          <h2>Telecom Nodal Officer Profile</h2>
          <p>Authorized SIM & IMEI CDR investigation liaison credentials.</p>
        </div>
        <div class="page-actions">
          <button class="btn btn-primary" onclick="CS_toast('Profile Saved','Profile details saved successfully.')">Save Profile</button>
        </div>
      </div>

      <div class="grid grid-3" style="grid-template-columns: 280px 1fr;">
        <div class="card card-pad flex-col items-center text-center">
          <span class="avatar avatar-lg" style="width:80px; height:80px; font-size:28px; margin-bottom:16px;">KR</span>
          <h4 style="font-weight:700;">Karthik Reddy</h4>
          <span class="chip chip-resolved" style="margin-top:6px;">Telecom Liaison</span>
          <div class="text-xs text-muted" style="margin-top:12px;">Bharti Airtel Ltd. · Regulatory Response Unit</div>
          <hr class="divider" style="width:100%;">
          <div class="w-full text-left flex-col gap-2 text-xs">
            <div class="flex justify-between">
              <span class="text-muted">DOT Authorization:</span>
              <span class="font-mono font-semibold text-accent">DOT-TEL-8891</span>
            </div>
            <div class="flex justify-between">
              <span class="text-muted">CDR Clearance:</span>
              <span class="font-semibold text-success">Level 4 Certified</span>
            </div>
          </div>
        </div>

        <div class="flex-col gap-5">
          <div class="card card-pad">
            <h4 style="margin-bottom:16px;">Nodal Officer Information</h4>
            <div class="grid grid-2">
              <div class="field">
                <label>Full Name</label>
                <input type="text" class="input" value="Karthik Reddy">
              </div>
              <div class="field">
                <label>Operator</label>
                <input type="text" class="input" value="Bharti Airtel Ltd." readonly style="background:var(--surface-sunken);">
              </div>
              <div class="field">
                <label>Secure Email</label>
                <input type="email" class="input" value="karthik.r@airtel.in">
              </div>
              <div class="field">
                <label>Emergency Line</label>
                <input type="text" class="input" value="+91 98450 99881">
              </div>
            </div>
          </div>
        </div>
      </div>
    </main>
  </div>
</div>
<script src="../../js/data.js"></script>
<script src="../../js/shell.js"></script>
<script src="../../js/app.js"></script>
<script>
  document.addEventListener("DOMContentLoaded", function(){
    CS_renderShell("telecom", "profile", {pageTitle: "Telecom Nodal Profile"});

    const user = CS_DATA.currentUser.telecom;
    if (user) {
      document.querySelector('.avatar-lg').textContent = user.initials || "KR";
      document.querySelector('.card-pad h4').textContent = user.name || "Karthik Reddy";
      document.querySelector('.text-xs.text-muted').textContent = `${user.org || 'Bharti Airtel Ltd.'} · Regulatory Response Unit`;
      
      const inputs = document.querySelectorAll('.input');
      if (inputs.length >= 3) {
        inputs[0].value = user.name || "";
        inputs[1].value = user.org || "Bharti Airtel Ltd.";
        inputs[2].value = user.email || "";
      }
    }

    const saveBtn = document.querySelector('.page-actions .btn-primary');
    if (saveBtn) {
      saveBtn.onclick = null;
      saveBtn.addEventListener('click', () => {
        const inputs = document.querySelectorAll('.input');
        const name = inputs[0].value;
        const email = inputs[2].value;
        
        CS_DATA.currentUser.telecom.name = name;
        CS_DATA.currentUser.telecom.email = email;
        CS_DATA.currentUser.telecom.initials = name.split(' ').map(n=>n[0]).join('').slice(0,2).toUpperCase();
        CS_DATA.saveState();
        
        CS_toast('Profile updated', 'Your changes have been saved.');
        setTimeout(() => window.location.reload(), 800);
      });
    }
  });
</script>
</body>
</html>
