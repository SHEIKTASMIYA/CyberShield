<!DOCTYPE html>

<head>

<title>500 · Something went wrong — CyberShield</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="../css/base.css">
<link rel="stylesheet" href="../css/components.css">
<style>
.state-shell{ max-width:460px; margin:120px auto; padding:0 24px; text-align:center; }
.state-icon{ width:64px; height:64px; border-radius:18px; background:var(--danger-soft); color:var(--danger); display:flex; align-items:center; justify-content:center; margin:0 auto 24px; }

<body data-page="500">

  <h2>Something went wrong on our end</h2>
  <p class="text-secondary" style="margin:10px 0 28px;">Our engineering team has been notified automatically. Please try again in a few minutes.</p>
  <div class="flex gap-3" style="justify-content:center;">
    <button onclick="window.location.reload()" class="btn btn-secondary">Retry</button>
    <a href="../public/index.html" class="btn btn-primary">Go home</a>
  </div>
</div>

</html>
