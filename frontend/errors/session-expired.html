<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Session expired — CyberShield</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/tokens.css">
<link rel="stylesheet" href="../css/base.css">
<link rel="stylesheet" href="../css/components.css">
<style>
.state-shell{ max-width:440px; margin:120px auto; padding:0 24px; text-align:center; }
.state-icon{ width:64px; height:64px; border-radius:18px; background:var(--warning-soft); color:var(--amber-600); display:flex; align-items:center; justify-content:center; margin:0 auto 24px; }
.state-code{ font-family:var(--font-mono); font-size:12px; color:var(--text-muted); letter-spacing:.08em; text-transform:uppercase; margin-bottom:12px; }
</style>
</head>
<body data-page="session-expired">
<div class="state-shell">
  <div class="state-icon"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/></svg></div>
  <div class="state-code">Session Timeout</div>
  <h2>You've been signed out</h2>
  <p class="text-secondary" style="margin:10px 0 28px;">For your security, sessions end automatically after 30 minutes of inactivity. Please log in again to continue.</p>
  <a href="../auth/login.html" class="btn btn-primary btn-lg">Log in again</a>
</div>
</body>
</html>
