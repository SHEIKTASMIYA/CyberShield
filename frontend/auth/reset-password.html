<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Set a new password — CyberShield</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/tokens.css">
<link rel="stylesheet" href="../css/base.css">
<link rel="stylesheet" href="../css/components.css">
<link rel="stylesheet" href="../css/auth.css">
<style>.mini-shell{ max-width:400px; margin:100px auto; padding:0 24px; }
.pw-rules{ display:flex; flex-direction:column; gap:6px; margin:-8px 0 20px; }
.pw-rules div{ font-size:12px; color:var(--text-muted); display:flex; align-items:center; gap:8px; }
.pw-rules svg{ width:14px; height:14px; color:var(--success); }
</style>
</head>
<body data-page="reset-password">
<div class="mini-shell">
  <a href="../public/index.html" class="flex items-center gap-2" style="margin-bottom:40px;">
    <span class="brand-mark" style="width:32px;height:32px;"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"><path d="M12 2 3 6v6c0 5 3.8 9.3 9 10 5.2-.7 9-5 9-10V6l-9-4Z"/></svg></span>
    <span style="font-weight:800; font-size:17px;">CyberShield</span>
  </a>
  <h2>Set a new password</h2>
  <p class="text-secondary" style="margin:8px 0 24px;">Choose a strong password you haven't used before.</p>
  <form onsubmit="event.preventDefault(); CS_toast('Password updated','You can now log in with your new password'); setTimeout(()=>window.location.href='login.html',900);">
    <div class="field"><label for="np">New password</label><input class="input" id="np" type="password" required></div>
    <div class="field"><label for="cp">Confirm password</label><input class="input" id="cp" type="password" required></div>
    <div class="pw-rules">
      <div><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M20 6 9 17l-5-5"/></svg> Minimum 10 characters</div>
      <div><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M20 6 9 17l-5-5"/></svg> One uppercase & one number</div>
      <div><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M20 6 9 17l-5-5"/></svg> One special character</div>
    </div>
    <button class="btn btn-primary btn-block btn-lg" type="submit">Update password</button>
  </form>
</div>
<script src="../js/app.js"></script>
</body>
</html>
