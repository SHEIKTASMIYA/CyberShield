<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reset your password — CyberShield</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/tokens.css">
<link rel="stylesheet" href="../css/base.css">
<link rel="stylesheet" href="../css/components.css">
<link rel="stylesheet" href="../css/auth.css">
<style>.mini-shell{ max-width:400px; margin:100px auto; padding:0 24px; }</style>
</head>
<body data-page="forgot-password">
<div class="mini-shell">
  <a href="../public/index.html" class="flex items-center gap-2" style="margin-bottom:40px;">
    <span class="brand-mark" style="width:32px;height:32px;"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"><path d="M12 2 3 6v6c0 5 3.8 9.3 9 10 5.2-.7 9-5 9-10V6l-9-4Z"/></svg></span>
    <span style="font-weight:800; font-size:17px;">CyberShield</span>
  </a>
  <h2>Forgot your password?</h2>
  <p class="text-secondary" style="margin:8px 0 28px;">Enter your registered email and we'll send a secure reset link.</p>
  <form onsubmit="event.preventDefault(); window.location.href='reset-password.html';">
    <div class="field">
      <label for="fe">Email address</label>
      <input class="input" id="fe" type="email" placeholder="you@institution.gov.in" required>
    </div>
    <button class="btn btn-primary btn-block btn-lg" type="submit">Send reset link</button>
  </form>
  <a href="login.html" class="text-sm" style="display:block; text-align:center; margin-top:24px; color:var(--accent-strong); font-weight:600;">← Back to log in</a>
</div>
</body>
</html>
